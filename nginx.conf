# Custom nginx config for Base44 dev serving of the static site.
# The repo root is bind-mounted read-only; on the sandbox it can be mode 700
# (root-only), so the nginx worker must run as root to traverse and read it.
user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript text/plain;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
