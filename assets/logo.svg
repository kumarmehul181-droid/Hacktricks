<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Hacktricks Logo</title>
  <desc id="desc">Cybersecurity learning logo with shield, terminal, and code accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" x2="1">
      <stop offset="0%" stop-color="#18d39f"/>
      <stop offset="100%" stop-color="#2ec5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7ef9d2"/>
      <stop offset="100%" stop-color="#3ddcff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="240" rx="18" fill="url(#bg)"/>

  <g transform="translate(35,25)">
    <path d="M110 12 L190 50 L190 105 Q190 148 154 172 L110 200 L66 172 Q30 148 30 105 L30 50 Z" fill="url(#shield)" opacity="0.95"/>
    <path d="M110 38 L160 61 L160 102 Q160 129 136 145 L110 165 L84 145 Q60 129 60 102 L60 61 Z" fill="#0b1d2c" opacity="0.82"/>
    <path d="M90 92 L110 110 L134 82" fill="none" stroke="#d8fff8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 124 L110 142 L132 116" fill="none" stroke="#8ff7d8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <rect x="210" y="58" width="178" height="104" rx="10" fill="#0a1b2b" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="228" y="88" font-family="monospace" font-size="22" fill="#7ef9d2">root@hacktricks</text>
    <text x="228" y="118" font-family="monospace" font-size="20" fill="#bffdf1">$ ./learn --roadmap</text>
    <text x="228" y="147" font-family="monospace" font-size="18" fill="#8ae8ff"># ethical_hacking</text>
    <path d="M220 164 H362" stroke="#18d39f" stroke-width="2" opacity="0.65"/>
  </g>

  <g transform="translate(420,72)">
    <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#e6feff">Hacktricks</text>
    <text x="0" y="56" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9adfe6">Ethical Hacking</text>
    <text x="0" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a7f3d0">Learning Roadmap</text>
    <rect x="0" y="108" width="120" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
