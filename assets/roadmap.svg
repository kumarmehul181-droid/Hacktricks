<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hacktricks Learning Roadmap</title>
  <desc id="desc">A roadmap showing foundational learning, intermediate skills, and advanced professional pentesting topics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="100%" stop-color="#0b1d2c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#18d39f"/>
      <stop offset="100%" stop-color="#52f0c0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#2ec5ff"/>
      <stop offset="100%" stop-color="#6ed9ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#8d7bff"/>
      <stop offset="100%" stop-color="#c29cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ebfeff">Ethical Hacking Learning Roadmap</text>

  <g>
    <rect x="80" y="120" width="280" height="280" rx="18" fill="#0d2130" stroke="url(#green)" stroke-width="3"/>
    <text x="220" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#8af2d4">Level 1</text>
    <text x="220" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#dcfff5">Beginner</text>
    <line x1="220" y1="210" x2="220" y2="230" stroke="#8af2d4" stroke-width="2"/>
    <text x="220" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d7fff5">Networking</text>
    <text x="220" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d7fff5">Linux Fundamentals</text>
    <text x="220" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d7fff5">Lab Setup</text>
    <text x="220" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d7fff5">Basic Tools</text>
    <text x="220" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d7fff5">Practice</text>
  </g>

  <g>
    <rect x="460" y="120" width="280" height="280" rx="18" fill="#0d2130" stroke="url(#blue)" stroke-width="3"/>
    <text x="600" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#93dcff">Level 2</text>
    <text x="600" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e5f9ff">Intermediate</text>
    <line x1="600" y1="210" x2="600" y2="230" stroke="#93dcff" stroke-width="2"/>
    <text x="600" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5f9ff">Reconnaissance</text>
    <text x="600" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5f9ff">Web App Security</text>
    <text x="600" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5f9ff">Exploitation Basics</text>
    <text x="600" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5f9ff">Scripting</text>
    <text x="600" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5f9ff">Tooling</text>
  </g>

  <g>
    <rect x="840" y="120" width="280" height="280" rx="18" fill="#0d2130" stroke="url(#purple)" stroke-width="3"/>
    <text x="980" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#d1c7ff">Level 3</text>
    <text x="980" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#f1ebff">Pro</text>
    <line x1="980" y1="210" x2="980" y2="230" stroke="#d1c7ff" stroke-width="2"/>
    <text x="980" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f1ebff">Privilege Escalation</text>
    <text x="980" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f1ebff">AD Attacks</text>
    <text x="980" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f1ebff">Post-Exploitation</text>
    <text x="980" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f1ebff">API / Mobile Testing</text>
    <text x="980" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f1ebff">Reporting</text>
  </g>

  <g>
    <path d="M360 260 H460" stroke="#7ef9d2" stroke-width="4" stroke-linecap="round"/>
    <path d="M460 260 L444 252 L444 268 Z" fill="#7ef9d2"/>
    <path d="M740 260 H840" stroke="#7ef9d2" stroke-width="4" stroke-linecap="round"/>
    <path d="M840 260 L824 252 L824 268 Z" fill="#7ef9d2"/>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#dffcff">Fundamentals → Practice → Professional Security Work</text>
</svg>
