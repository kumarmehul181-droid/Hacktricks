# Base44 development compose for the CyberSphere / Ethical Hacking Roadmap static site.
# This is a pure static HTML/CSS site (single index.html, no framework, no build step).
# nginx serves the bind-mounted source directly, so edits to index.html / assets
# appear on the next request without a rebuild.
services:
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      # Bind-mount the cloned source so live edits are served immediately.
      - ./:/usr/share/nginx/html:ro
      # Custom config: run worker as root so it can traverse the (700) repo dir.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
